en:
  page_title: Charts
  page_description: "Interactive charts drawn with ECharts in SVG — line, area, bar and more — coloured by the design system, in light and dark, in the page's language."
  page_icon: ph:bold/chart-line
  intro: >-
    The chart() function of symfony-charts-ds: ECharts drawn in svg, coloured
    by the design system in both colour schemes, numbers and months written in
    the page's language. Hover a chart for its exact values.
  section:
    line:
      title: Line
      description: Two series, smoothed. The legend shows as soon as there is more than one.
    area:
      title: Stacked area
      description: The same series stacked; the second takes the mint of the categories.
    bar:
      title: Bars, in euros
      description: format { style currency } — compact on the axis, whole in the tooltip.
    horizontal:
      title: Horizontal stacked bars
      description: horizontal and stacked, for labels too long to stand under a bar.
    donut:
      title: Donut
      description: How a total divides; the share of each part in the tooltip.
    boxplot:
      title: Box plot
      description: >-
        Durations per stage, from the raw samples: the quartiles are computed by
        the component. A unit format writes the days.
    histogram:
      title: Histogram
      description: Three hundred yields, in twelve bins of equal width.
    endpoint:
      title: Fed by the api
      description: >-
        Given a source instead of data: the chart reads the points of that chart
        through the generated ChartPoint repository, from a provider the demo
        declares — the road every entity list of the stack takes.
    empty:
      title: No data
      description: A chart with nothing to draw says so instead of drawing empty axes.
  series:
    orders: Orders
    returns: Returns
    revenue: Revenue
    work_orders: Work orders
    duration: Duration
  stage:
    weaving: Weaving
    finishing: Finishing
    waiting: Waiting
    shipping: Shipping

fr:
  page_title: Graphiques
  page_description: "Des graphiques interactifs dessinés en SVG avec ECharts — courbes, aires, barres et plus — colorés par le design system, en clair et en sombre, dans la langue de la page."
  page_icon: ph:bold/chart-line
  intro: >-
    La fonction chart() de symfony-charts-ds : ECharts dessiné en svg, coloré
    par le design system dans les deux thèmes, nombres et mois écrits dans la
    langue de la page. Survolez un graphique pour ses valeurs exactes.
  section:
    line:
      title: Courbes
      description: Deux séries, lissées. La légende s'affiche dès qu'il y en a plus d'une.
    area:
      title: Aires empilées
      description: Les mêmes séries empilées ; la seconde prend le menthe des catégories.
    bar:
      title: Barres, en euros
      description: format { style currency } — compact sur l'axe, complet dans l'infobulle.
    horizontal:
      title: Barres horizontales empilées
      description: horizontal et stacked, pour des libellés trop longs sous une barre.
    donut:
      title: Anneau
      description: Comment un total se répartit ; la part de chaque segment dans l'infobulle.
    boxplot:
      title: Boîte à moustaches
      description: >-
        Les durées par étape, depuis les échantillons bruts : le composant
        calcule les quartiles. Un format d'unité écrit les jours.
    histogram:
      title: Histogramme
      description: Trois cents rendements, en douze classes de même largeur.
    endpoint:
      title: Alimenté par l'api
      description: >-
        Une source au lieu des données : le graphique lit les points de ce
        graphique par le repository ChartPoint généré, depuis un fournisseur que
        la démo déclare — la route de toute liste d'entités de la stack.
    empty:
      title: Sans données
      description: Un graphique sans rien à dessiner le dit, au lieu de tracer des axes vides.
  series:
    orders: Commandes
    returns: Retours
    revenue: Chiffre d'affaires
    work_orders: Ordres de fabrication
    duration: Durée
  stage:
    weaving: Tissage
    finishing: Finition
    waiting: Attente
    shipping: Expédition

zh:
  page_title: 图表
  page_description: "使用 ECharts 以 SVG 绘制的交互式图表——折线图、面积图、柱状图等——由设计系统配色，支持浅色与深色模式，并使用页面语言。"
  page_icon: 'ph:bold/chart-line'
  intro: 'symfony-charts-ds 的 chart() 函数：用 svg 绘制的 ECharts，按照设计系统的配色方案着色，数字和月份使用页面语言书写。将鼠标悬停在图表上可查看其确切值。'
  section:
    line:
      title: 线图
      description: 两个系列，平滑处理。当有多个系列时，图例会显示。
    area:
      title: 堆叠区域
      description: 同一系列堆叠；第二个系列取类别的最小值。
    bar:
      title: 柱状图（以欧元为单位）
      description: '格式 { style currency } — 轴上紧凑，工具提示中为整数。'
    horizontal:
      title: 水平堆叠柱状图
      description: 水平且堆叠，适用于标签过长以致无法放在柱子下方的情况。
    donut:
      title: 甜甜圈图
      description: 总数的划分；工具提示中显示每个部分的份额。
    boxplot:
      title: 箱线图
      description: 各阶段的持续时间，来自原始样本：四分位数由组件计算。单位格式以天为单位。
    histogram:
      title: 直方图
      description: 三百个产出，分为十二个等宽的区间。
    endpoint:
      title: '由 API 提供数据'
      description: '给定一个数据源而非数据：图表通过生成的 ChartPoint 仓库读取该图表的点，来自演示声明的提供者 — 堆栈中每个实体列表的路径。'
    empty:
      title: 无数据
      description: 一个没有绘制内容的图表会表明这一点，而不是绘制空的坐标轴。
  series:
    orders: 订单
    returns: 退货
    revenue: 收入
    work_orders: 工作订单
    duration: 持续时间
  stage:
    weaving: 织造
    finishing: ' finishing'
    waiting: 等待
    shipping: 运输

ar:
  page_title: المخططات
  page_description: "رسوم بيانية تفاعلية مرسومة بـ ECharts بصيغة SVG — خطية ومساحية وأعمدة وغيرها — ملوّنة بنظام التصميم، بالوضعين الفاتح والداكن، وبلغة الصفحة."
  page_icon: 'ph:bold/chart-line'
  intro: 'دالة chart() في symfony-charts-ds: المخططات الموجودة في svg، ملونة وفقًا لنظام التصميم في كلا نظامي الألوان، الأرقام والأشهر مكتوبة بلغة الصفحة. مرر فوق المخطط لرؤية قيمه الدقيقة.'
  section:
    line:
      title: خط
      description: 'سلسلتان، ملساء. تظهر الأسطورة بمجرد وجود أكثر من واحدة.'
    area:
      title: 'منطقة مكدسة'
      description: 'نفس السلسلة مكدسة؛ الثانية تأخذ الحد الأدنى من الفئات.'
    bar:
      title: 'أشرطة، باليورو'
      description: 'التنسيق { نمط العملة } — مضغوط على المحور، كامل في أداة التلميح.'
    horizontal:
      title: 'أشرطة أفقية مكدسة'
      description: 'أفقية ومكدسة، لعلامات طويلة جدًا لتقف تحت شريط.'
    donut:
      title: دونات
      description: 'كيف ينقسم الإجمالي؛ حصة كل جزء في أداة التلميح.'
    boxplot:
      title: 'مخطط الصندوق'
      description: 'الأوقات لكل مرحلة، من العينات الخام: يتم حساب الربعيات بواسطة المكون. تنسيق الوحدة يكتب الأيام.'
    histogram:
      title: 'التوزيع التكراري'
      description: 'ثلاثمائة عائد، في اثني عشر حاوية ذات عرض متساوي.'
    endpoint:
      title: 'مدعوم من واجهة برمجة التطبيقات'
      description: 'يتم إعطاء مصدر بدلاً من البيانات: يقرأ المخطط النقاط من ذلك المخطط من خلال مستودع ChartPoint الذي تم إنشاؤه، من مزود تعلن عنه العرض — الطريق الذي تأخذه كل قائمة كيان في المكدس.'
    empty:
      title: 'لا توجد بيانات'
      description: 'مخطط بلا شيء لرسمه يقول ذلك بدلاً من رسم محاور فارغة.'
  series:
    orders: الطلبات
    returns: الإرجاعات
    revenue: الإيرادات
    work_orders: 'أوامر العمل'
    duration: المدة
  stage:
    weaving: الحياكة
    finishing: التشطيب
    waiting: الانتظار
    shipping: الشحن

hi:
  page_title: चार्ट्स
  page_description: "ECharts से SVG में बने इंटरैक्टिव चार्ट — लाइन, एरिया, बार और अन्य — डिज़ाइन सिस्टम के रंगों में, लाइट और डार्क दोनों में, पेज की भाषा में।"
  page_icon: 'ph:bold/chart-line'
  intro: 'symfony-charts-ds का chart() फ़ंक्शन: ECharts जो svg में बनाए जाते हैं, डिज़ाइन सिस्टम द्वारा दोनों रंग योजनाओं में रंगीन, संख्याएँ और महीने पृष्ठ की भाषा में लिखे जाते हैं। चार्ट पर होवर करें इसके सटीक मानों के लिए।'
  section:
    line:
      title: लाइन
      description: 'दो श्रृंखलाएँ, स्मूदेड। एक से अधिक होने पर किंवदंती दिखती है।'
    area:
      title: 'स्टैक्ड एरिया'
      description: 'एक ही श्रृंखला स्टैक की गई; दूसरी श्रेणियों का न्यूनतम लेती है।'
    bar:
      title: 'बार्स, यूरो में'
      description: 'फॉर्मेट { स्टाइल मुद्रा } — अक्ष पर संक्षिप्त, टूलटिप में पूरा।'
    horizontal:
      title: 'Horizontal stacked bars'
      description: 'क्षितिज और स्टैक्ड, लेबल के लिए जो बार के नीचे खड़े होने के लिए बहुत लंबे हैं।'
    donut:
      title: डोनट
      description: 'किस प्रकार एक कुल विभाजित होता है; टूलटिप में प्रत्येक भाग का हिस्सा।'
    boxplot:
      title: 'बॉक्स प्लॉट'
      description: 'कच्चे नमूनों से प्रत्येक चरण की अवधि: चतुर्थांश घटक द्वारा गणना की जाती है। एक यूनिट फॉर्मेट दिन लिखता है।'
    histogram:
      title: हिस्टोग्राम
      description: 'तीस सौ उपज, बारह समान चौड़ाई के बिन में।'
    endpoint:
      title: 'एपीआई द्वारा प्रदान किया गया'
      description: 'डेटा के बजाय एक स्रोत दिया गया: चार्ट उस चार्ट के पॉइंट को जनरेटेड ChartPoint रिपॉजिटरी के माध्यम से पढ़ता है, एक प्रदाता से जो डेमो घोषित करता है — स्टैक का हर एंटिटी सूची का रास्ता।'
    empty:
      title: 'कोई डेटा नहीं'
      description: 'कुछ न होने पर चार्ट कहता है कि वह खाली अक्ष खींचने के बजाय ऐसा करता है।'
  series:
    orders: ऑर्डर
    returns: रिटर्न्स
    revenue: राजस्व
    work_orders: 'कार्य आदेश'
    duration: अवधि
  stage:
    weaving: बुनाई
    finishing: फिनिशिंग
    waiting: इंतजार
    shipping: शिपिंग

he:
  page_title: תרשימים
  page_description: "תרשימים אינטראקטיביים המצוירים ב-SVG עם ECharts — קו, שטח, עמודות ועוד — בצבעי מערכת העיצוב, בבהיר ובכהה, בשפת העמוד."
  page_icon: 'ph:bold/chart-line'
  intro: 'הפונקציה chart() של symfony-charts-ds: ECharts מצויירים ב-svg, בצבעים של מערכת העיצוב בשני סכמות צבע, מספרים וחודשים כתובים בשפה של הדף. רדו על תרשים כדי לראות את הערכים המדויקים שלו.'
  section:
    line:
      title: קו
      description: 'שתי סדרות, מעוגלות. האגדה מופיעה ברגע שיש יותר מאחת.'
    area:
      title: 'אזור מצטבר'
      description: 'אותן סדרות מצטברות; השנייה לוקחת את המינימום של הקטגוריות.'
    bar:
      title: 'ברים, באירו'
      description: 'פורמט { style currency } — קומפקטי על הציר, שלם בטיפ של העכבר.'
    horizontal:
      title: 'ברים אופקיים מצטברים'
      description: 'אופקיים ומצטברים, עבור תוויות ארוכות מדי כדי לעמוד מתחת לבר.'
    donut:
      title: דונאט
      description: 'איך סך כל מתחלק; החלק של כל חלק בטיפ של העכבר.'
    boxplot:
      title: 'תיבת תרשים'
      description: 'זמנים לפי שלב, מדגימות גולמיות: הרבעונים מחושבים על ידי הרכיב. פורמט יחידה כותב את הימים.'
    histogram:
      title: היסטוגרמה
      description: 'שלוש מאות תפוקות, בשנים עשר תיבות ברוחב שווה.'
    endpoint:
      title: 'מוזן על ידי ה-api'
      description: 'נכון מקור במקום נתונים: התרשים קורא את הנקודות של התרשים הזה דרך מאגר ChartPoint שנוצר, מספק שהדמו מצהיר — הדרך של כל רשימת ישות של הערימה.'
    empty:
      title: 'אין נתונים'
      description: 'תרשים שאין מה לצייר אומר כך במקום לצייר צירים ריקים.'
  series:
    orders: הזמנות
    returns: החזרות
    revenue: הכנסות
    work_orders: 'הזמנות עבודה'
    duration: משך
  stage:
    weaving: אריגה
    finishing: גימור
    waiting: המתנה
    shipping: משלוח

fa:
  page_title: نمودارها
  page_description: "نمودارهای تعاملی ترسیم‌شده با ECharts در قالب SVG — خطی، مساحتی، میله‌ای و بیشتر — با رنگ‌های سیستم طراحی، در حالت روشن و تیره و به زبان صفحه."
  page_icon: 'ph:bold/chart-line'
  intro: 'تابع chart() از symfony-charts-ds: ECharts که در svg رسم شده و با سیستم طراحی در هر دو طرح رنگی رنگ‌آمیزی شده است، اعداد و ماه‌ها به زبان صفحه نوشته می‌شوند. بر روی یک نمودار حرکت کنید تا مقادیر دقیق آن را ببینید.'
  section:
    line:
      title: خطی
      description: 'دو سری، صاف شده. افسانه به محض وجود بیش از یک سری نمایش داده می‌شود.'
    area:
      title: 'منطقه انباشته'
      description: 'سری‌های مشابه انباشته شده؛ دومی حداقل دسته‌ها را می‌گیرد.'
    bar:
      title: 'میله‌ها، به یورو'
      description: 'فرمت { style currency } — فشرده در محور، کامل در راهنمای ابزار.'
    horizontal:
      title: 'میله‌های افقی انباشته'
      description: 'افقی و انباشته، برای برچسب‌هایی که خیلی طولانی هستند تا زیر یک میله قرار بگیرند.'
    donut:
      title: دونات
      description: 'چگونه یک مجموع تقسیم می‌شود؛ سهم هر بخش در راهنمای ابزار.'
    boxplot:
      title: 'نمودار جعبه‌ای'
      description: 'مدت زمان‌ها در هر مرحله، از نمونه‌های خام: چارک‌ها توسط کامپوننت محاسبه می‌شوند. یک فرمت واحد روزها را می‌نویسد.'
    histogram:
      title: هیستوگرام
      description: 'سیصد محصول، در دوازده سبد با عرض مساوی.'
    endpoint:
      title: 'تأمین شده توسط API'
      description: 'با توجه به یک منبع به جای داده‌ها: نمودار نقاط آن نمودار را از طریق مخزن ChartPoint تولید شده می‌خواند، از یک ارائه‌دهنده که دموی اعلام می‌کند — جاده‌ای که هر لیست موجودیت از انباشته می‌گیرد.'
    empty:
      title: 'بدون داده'
      description: 'نموداری که چیز قابل رسم ندارد، به جای رسم محورهای خالی، این را نشان می‌دهد.'
  series:
    orders: سفارشات
    returns: مرجوعی‌ها
    revenue: درآمد
    work_orders: 'سفارشات کاری'
    duration: 'مدت زمان'
  stage:
    weaving: بافت
    finishing: تکمیل
    waiting: منتظر
    shipping: ارسال

ur:
  page_title: چارٹس
  page_description: "ECharts سے SVG میں بنے انٹرایکٹو چارٹس — لائن، ایریا، بار اور مزید — ڈیزائن سسٹم کے رنگوں میں، لائٹ اور ڈارک دونوں میں، صفحے کی زبان میں۔"
  page_icon: 'ph:bold/chart-line'
  intro: 'symfony-charts-ds کا chart() فنکشن: ECharts جو svg میں بنائے گئے ہیں، ڈیزائن سسٹم کے مطابق دونوں رنگ سکیموں میں رنگین ہیں، نمبر اور مہینے صفحے کی زبان میں لکھے گئے ہیں۔ درست قیمتوں کے لیے چارٹ پر ہور کریں۔'
  section:
    line:
      title: لائن
      description: 'دو سلسلے، ہموار۔ لیجنڈ اسی وقت ظاہر ہوتا ہے جب ایک سے زیادہ ہوں۔'
    area:
      title: 'اسٹیکڈ ایریا'
      description: 'ایک ہی سلسلے اسٹیک کیے گئے؛ دوسرا زمرہ جات کا منٹ لیتا ہے۔'
    bar:
      title: 'بارز، یورو میں'
      description: 'format { style currency } — محور پر کمپیکٹ، ٹول ٹپ میں مکمل۔'
    horizontal:
      title: 'افقی اسٹیکڈ بارز'
      description: 'افقی اور اسٹیکڈ، لیبلز کے لیے جو بار کے نیچے کھڑے ہونے کے لیے بہت لمبے ہیں۔'
    donut:
      title: ڈونٹ
      description: 'ایک مجموعہ کس طرح تقسیم ہوتا ہے؛ ہر حصے کا حصہ ٹول ٹپ میں۔'
    boxplot:
      title: 'باکس پلاٹ'
      description: 'ہر مرحلے کے لیے دورانیے، خام نمونوں سے: چوتھائیوں کا حساب کمپوننٹ کے ذریعے کیا جاتا ہے۔ ایک یونٹ فارمیٹ دنوں کو لکھتا ہے۔'
    histogram:
      title: ہسٹگرام
      description: 'تین سو پیداوار، بارہ برابر چوڑائی کے بنز میں۔'
    endpoint:
