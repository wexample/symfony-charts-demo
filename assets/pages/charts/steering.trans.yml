    forecast:
      title: 'वास्तविक बनाम भविष्यवाणी'
      description: 'वास्तविक रेखा आज पर रुकती है; भविष्यवाणी डैश के साथ जारी रहती है, इसकी आत्मविश्वास बैंड के भीतर।'
    sparkline:
      title: 'प्रत्येक पंक्ति के लिए एक स्पार्कलाइन'
      description: 'सर्वर पर छह महीनों के आदेश, अंतिम तीन हाइलाइटेड: तीन हजार पंक्तियों की एक तालिका उनके लिए कोई स्क्रिप्ट नहीं चलाती।'
