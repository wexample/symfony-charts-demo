en:
  page_title: Steering
  page_icon: ph:bold/gauge
  intro: >-
    The charts a production steering screen is made of, on made-up figures:
    the load of each loom group against its capacity, the output against its
    forecast, and the orders of each item in its table row.
  section:
    capacity:
      title: Load against capacity
      description: >-
        A bar per group, its capacity as a tick across it. Above 85 % the bar
        warns, above 100 % it is overloaded: the thresholds are an option.
    forecast:
      title: Actual against forecast
      description: >-
        The actual line stops at today; the forecast carries on dashed, inside
        its confidence band.
    sparkline:
      title: A sparkline per row
      description: >-
        Six months of orders drawn on the server, the last three highlighted: a
        table of three thousand rows runs no script for them.
  column:
    sku: Item
    orders: Orders, 6 months
    average: Average
    available: Available

fr:
  page_title: Pilotage
  page_icon: ph:bold/gauge
  intro: >-
    Les graphiques d'un écran de pilotage de production, sur des chiffres
    inventés : la charge de chaque groupe de métiers face à sa capacité, la
    production face à sa prévision, et les commandes de chaque article dans sa
    ligne de tableau.
  section:
    capacity:
      title: Charge et capacité
      description: >-
        Une barre par groupe, sa capacité en trait vertical. Au-delà de 85 % la
        barre avertit, au-delà de 100 % elle est en surcharge : les seuils sont
        une option.
    forecast:
      title: Réel et prévision
      description: >-
        La courbe réelle s'arrête à aujourd'hui ; la prévision continue en
        pointillés, dans son intervalle de confiance.
    sparkline:
      title: Une sparkline par ligne
      description: >-
        Six mois de commandes dessinés côté serveur, les trois derniers mis en
        évidence : un tableau de trois mille lignes n'exécute aucun script pour
        elles.
  column:
    sku: Article
    orders: Commandes, 6 mois
    average: Moyenne
    available: Disponible

zh:
  page_title: ' steering'
  page_icon: 'ph:bold/gauge'
  intro: 生产引导屏幕由图表组成，这些图表基于虚构数据：每组织机的负载与其容量的对比，产出与预测的对比，以及每个项目在其表格行中的订单。
  section:
    capacity:
      title: 负载与容量
      description: 每组一个条形图，其容量用一个标记表示。超过85%时条形图发出警告，超过100%时表示超载：这些阈值是可选的。
    forecast:
      title: 实际与预测
      description: 实际线停在今天；预测线以虚线继续，在其置信区间内。
    sparkline:
      title: 每行一个微型图
      description: 服务器上绘制的六个月订单，最后三个月高亮显示：三千行的表格不会为它们运行任何脚本。
  column:
    sku: 项目
    orders: 订单，6个月
    average: 平均值
    available: 可用

ar:
  page_title: التوجيه
  page_icon: 'ph:bold/gauge'
  intro: 'الرسوم البيانية التي تتكون منها شاشة توجيه الإنتاج، بناءً على أرقام وهمية: الحمل لكل مجموعة نول مقابل طاقتها، الإنتاج مقابل توقعاته، وطلبات كل عنصر في صفه الجدولي.'
  section:
    capacity:
      title: 'الحمل مقابل السعة'
      description: 'شريط لكل مجموعة، وسعتها كعلامة عبره. فوق 85% يحذر الشريط، فوق 100% يكون محملاً بشكل زائد: العتبات خيار.'
    forecast:
      title: 'الفعلي مقابل التوقع'
      description: 'يتوقف الخط الفعلي عند اليوم؛ يستمر التوقع متقطعًا، داخل نطاق ثقته.'
    sparkline:
      title: 'خط صغير لكل صف'
      description: 'ستة أشهر من الطلبات مرسومة على الخادم، تم تمييز الثلاثة الأخيرة: جدول مكون من ثلاثة آلاف صف لا يحتاج إلى أي سكربت لهم.'
  column:
    sku: العنصر
    orders: 'الطلبات، 6 أشهر'
    average: المتوسط
    available: المتوفر
